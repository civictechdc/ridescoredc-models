  .mlyth img{width:100%;height:54px;object-fit:cover;display:block;opacity:.8} .mlyth.on img,.mlyth:hover img{opacity:1} .mlyth span{display:block;font-size:10px;color:var(--muted);text-align:center;padding:2px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

<body>
<div id="map"></div>
<div id="side">
  <header>
    <h1>Feels vs. Is <span>· DC bike safety</span></h1>
    <div class="tag" id="tag">How streets feel vs. what happens on them. 28,978 segments, 2,297 injury crashes since Oct 2021.</div>
    <div class="search"><input id="q" placeholder="Search a street (e.g. 15th Street Northwest)" autocomplete="off"><button class="clr" id="clr" title="clear">×</button><div class="sugg" id="sugg"></div></div>
    <div class="row2">
      <select id="ward"><option value="">Ward report…</option></select>
      <select id="show"><option value="all">Show: everything</option><option value="problem">Show: hidden danger + fix first</option><option value="kid">Show: kid ok (LTS 1)</option><option value="changed">Show: changed since 2019</option><option value="rising">Show: rising crash trend</option></select>
    </div>
  </header>
  <div id="body"></div>
</div>
<div id="toast"></div>
<script>
const BUILD = "20261003155428";
const TOKEN = (window.FVI_CONFIG && window.FVI_CONFIG.mapboxToken) || "";
const USE_MAPBOX = /^pk\./.test(TOKEN);
const GAP = { hidden_danger:["#ff4d6d","Hidden danger","feels safe, people get hurt"], fix_first:["#ff9f1c","Fix first","bad on both counts"],
              scary_but_quiet:["#6c8cff","Scary but quiet","hostile, few crashes, riders avoid it"], calm:["#3ddc97","Calm","fine on both"], middle:["#3a3f4b","Middle",""] };
const TREND = { rising:["#ff4d6d","Rising"], "rising?":["#ff8da1","Rising (weak)"], falling:["#3ddc97","Falling"], "falling?":["#8fe8c2","Falling (weak)"], flat:["#8a8f9c","Flat"], "too few":["#6b7280","Too few crashes"] };
const LAYERS = {
  feels:{title:"Feels: comfort (LTS-based)",prop:"comfort_score",ramp:["#b1152a","#e8632d","#f2c14e","#79b64a","#1f8a4c"],low:"stressful",high:"comfortable",
         blurb:"Comfort 0 to 100 from the street's design: facility, speed, lanes, volume, parking, pavement. Furth's Level of Traffic Stress with Montgomery County amendments."},
  is:{title:"Is: harm (crash record, smoothed)",prop:"harm_score",ramp:["#1f8a4c","#79b64a","#f2c14e","#e8632d","#b1152a"],low:"low harm",high:"high harm",
      blurb:"Harm 0 to 100 from five years of bicyclist injury crashes, smoothed by what streets of the same design usually see (Empirical Bayes). 90 means the worst 10 percent of the network."},
  gap:{title:"Gap: where Feels and Is disagree",blurb:"Where the stress score and the crash record disagree. Hidden danger is the short list to look at first."},
  trend:{title:"Trend: crashes since 2025 vs before",blurb:"Each block's crash rate since Jan 2025 compared with Oct 2021 to Dec 2024, relative to the citywide change (recorded injuries rose about 1.7x across DC). Rising means at least 1.5x that with 2 or more recent crashes. Small counts stay grey."}
};
let map, GL, segData, reports, hoverPop, state = { layer:"gap", street:null, ward:null, show:"all" };
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const fmt1 = v => v == null ? "n/a" : (+v).toFixed(1);
const MLY = (window.FVI_CONFIG && window.FVI_CONFIG.mapillaryToken) || "";
// Mapillary street-level imagery, embedded in the popup when a client token is configured.
const mlyApp = ll => `https://www.mapillary.com/app/?lat=${ll.lat.toFixed(6)}&lng=${ll.lng.toFixed(6)}&z=18`;
function mlyBlock(ll){ if (!MLY) return `<a class="sv" target="_blank" rel="noopener" href="${mlyApp(ll)}">Street-level imagery on Mapillary ↗</a>`; const id = "mly" + Math.random().toString(36).slice(2); setTimeout(() => fillMly(id, ll), 0); return `<div class="mly" id="${id}"><span class="k">Looking for Mapillary imagery…</span></div>`; }
async function fillMly(id, ll){
  const el = document.getElementById(id); if (!el) return;
  const d = 0.0007; const bbox = [ll.lng - d, ll.lat - d, ll.lng + d, ll.lat + d].map(v => v.toFixed(6)).join(",");
  const appAt = (img) => { const c = img.computed_geometry ? img.computed_geometry.coordinates : [ll.lng, ll.lat]; return `https://www.mapillary.com/app/?pKey=${img.id}&lat=${c[1].toFixed(6)}&lng=${c[0].toFixed(6)}&z=18&focus=photo`; };
  const when = (img) => img.captured_at ? new Date(img.captured_at).toLocaleDateString(undefined, { year: "numeric", month: "short" }) : "";
  try {
    const r = await fetch(`https://graph.mapillary.com/images?access_token=${encodeURIComponent(MLY)}&fields=id,captured_at,computed_geometry,thumb_256_url&bbox=${bbox}&limit=50`);
    const js = await r.json();
    let imgs = (js.data || []).map(x => { const c = x.computed_geometry ? x.computed_geometry.coordinates : null; const dist = c ? Math.hypot((c[0] - ll.lng) * Math.cos(ll.lat * Math.PI / 180), c[1] - ll.lat) * 111000 : 1e9; return { ...x, dist }; })
      .filter(x => x.dist <= 80).sort((a, b) => a.dist - b.dist);
    // three photos: nearest overall, then the nearest from two other capture dates so the row spans time, else next nearest
    const picked = []; const days = new Set();
    for (const x of imgs) { const day = x.captured_at ? Math.floor(x.captured_at / 864e5) : -1; if (!days.has(day)) { picked.push(x); days.add(day); } if (picked.length === 3) break; }
    for (const x of imgs) { if (picked.length === 3) break; if (!picked.includes(x)) picked.push(x); }
    if (!picked.length) { el.innerHTML = `<span class="k">No Mapillary imagery within 80 m.</span> <a class="sv" target="_blank" rel="noopener" href="${mlyApp(ll)}">Look around on Mapillary ↗</a>`; return; }
    const best = picked[0];
    el.innerHTML = `<iframe src="https://www.mapillary.com/embed?image_key=${best.id}&style=photo" allow="fullscreen" loading="lazy" title="Mapillary street-level image"></iframe>
      <div class="mlyrow">${picked.map((x, i) => `<div class="mlyth${i === 0 ? " on" : ""}" data-i="${i}" title="Show this photo"><img src="${x.thumb_256_url || ""}" alt=""><span>${Math.round(x.dist)} m · ${when(x) || "undated"}</span></div>`).join("")}</div>
      <div class="mlycap">Mapillary · <span class="mlywhich">${Math.round(best.dist)} m from the click${when(best) ? " · " + when(best) : ""}</span> · <a class="mlyopen" target="_blank" rel="noopener" href="${appAt(best)}">open at this spot ↗</a></div>`;
    el.querySelectorAll(".mlyth").forEach(t => t.onclick = () => { const x = picked[+t.dataset.i]; el.querySelector("iframe").src = `https://www.mapillary.com/embed?image_key=${x.id}&style=photo`; el.querySelector(".mlywhich").textContent = `${Math.round(x.dist)} m from the click${when(x) ? " · " + when(x) : ""}`; el.querySelector(".mlyopen").href = appAt(x); el.querySelectorAll(".mlyth").forEach(o => o.classList.toggle("on", o === t)); });
  } catch (e) { el.innerHTML = `<span class="k">Mapillary lookup failed.</span> <a class="sv" target="_blank" rel="noopener" href="${mlyApp(ll)}">Open Mapillary here ↗</a>`; }
}
function toast(msg){ const t=$("toast"); t.textContent=msg; t.style.display="block"; setTimeout(()=>t.style.display="none", 2600); }
function loadScript(src){ return new Promise((res,rej)=>{ const s=document.createElement("script"); s.src=src; s.onload=res; s.onerror=rej; document.head.appendChild(s); }); }
function loadCss(href){ const l=document.createElement("link"); l.rel="stylesheet"; l.href=href; document.head.appendChild(l); }

function rampExpr(prop, ramp){ const e=["interpolate",["linear"],["coalesce",["get",prop],0]]; [0,25,50,75,100].forEach((s,i)=>e.push(s,ramp[i])); return e; }
function matchExpr(prop, table, fallback){ const m=["match",["get",prop]]; for (const [k,v] of Object.entries(table)) m.push(k, v[0]); m.push(fallback); return m; }
function showFilter(){
  const s = state.show;
  if (s==="problem") return ["in",["get","gap_class"],["literal",["hidden_danger","fix_first"]]];
  if (s==="kid") return ["==",["get","kid_ok"],1];
  if (s==="changed") return ["has","changed"];
  if (s==="rising") return ["in",["get","trend"],["literal",["rising","rising?"]]];
  return null;
}
function scopeFilter(){
  if (state.street) return ["==",["get","street_key"],state.street];
  if (state.ward) return ["==",["get","ward"],state.ward];
  return null;
}
function applyFilters(){
  const f = ["all"]; const a=showFilter(), b=scopeFilter(); if (a) f.push(a); if (b) f.push(b);
  const filt = f.length>1 ? f : null;
  map.setFilter("seg", filt); map.setFilter("seg-case", filt); map.setFilter("seg-glow", filt);
  // context: everything else dimmed
  map.setLayoutProperty("seg-dim","visibility", filt ? "visible" : "none");
  map.setLayoutProperty("seg-changed","visibility", (state.show==="changed" || b) ? "visible" : "none");
  if (b) map.setFilter("seg-changed", ["all",["has","changed"],b]); else map.setFilter("seg-changed", ["has","changed"]);
  if (filt) map.setFilter("seg-dim", ["!", filt]);
}
function setLayer(key){
  state.layer = key; const L=LAYERS[key];
  document.querySelectorAll(".tabs button").forEach(b=>b.classList.toggle("on", b.dataset.layer===key));
  const glow = c => map.setPaintProperty("seg-glow","line-color",c);
  if (key==="gap"){ map.setPaintProperty("seg","line-color",matchExpr("gap_class",GAP,"#3a3f4b")); glow(matchExpr("gap_class",GAP,"#3a3f4b")); map.setPaintProperty("seg","line-opacity",["case",["==",["get","gap_class"],"middle"],0.35,1]); }
  else if (key==="trend"){ map.setPaintProperty("seg","line-color",matchExpr("trend",TREND,"#3a3f4b")); glow(matchExpr("trend",TREND,"#3a3f4b")); map.setPaintProperty("seg","line-opacity",["case",["==",["get","trend"],"too few"],0.3,1]); }
  else { map.setPaintProperty("seg","line-color",rampExpr(L.prop,L.ramp)); glow(rampExpr(L.prop,L.ramp)); map.setPaintProperty("seg","line-opacity",0.95); }
  const lg=$("legend"); if (!lg) return;
  $("blurb").textContent = L.blurb;
  if (key==="gap") lg.innerHTML = `<b>${L.title}</b>` + Object.values(GAP).map(([c,t,d])=>`<div class="cat"><span class="sw" style="background:${c}"></span><span><b>${t}</b>${d?": "+d:""}</span></div>`).join("");
  else if (key==="trend") lg.innerHTML = `<b>${L.title}</b>` + Object.values(TREND).map(([c,t])=>`<div class="cat"><span class="sw" style="background:${c}"></span>${t}</div>`).join("");
  else lg.innerHTML = `<b>${L.title}</b><div class="ramp" style="background:linear-gradient(90deg,${L.ramp.join(",")})"></div><div class="ramp-labels"><span>0 · ${L.low}</span><span>100 · ${L.high}</span></div>`;
  writeHash();
}
function writeHash(){ const p=new URLSearchParams(); p.set("layer",state.layer); if (state.street) p.set("street",state.street); if (state.ward) p.set("ward",state.ward); if (state.show!=="all") p.set("show",state.show); history.replaceState(null,"","#"+p.toString()); }
function readHash(){ const p=new URLSearchParams(location.hash.slice(1)); return { layer:p.get("layer")||"gap", street:p.get("street"), ward:p.get("ward"), show:p.get("show")||"all" }; }

/* ---------- sidebar: home ---------- */
function renderHome(){
  $("body").innerHTML = `
    <div class="tabs">${Object.keys(LAYERS).map(k=>`<button data-layer="${k}">${k[0].toUpperCase()+k.slice(1)}</button>`).join("")}</div>
    <div class="blurb" id="blurb"></div><div class="legend" id="legend"></div>
    <label class="toggle"><input type="checkbox" id="dots" checked> intersection crashes (size = crashes, white ring = serious)</label>
    <label class="toggle"><input type="checkbox" class="lm" data-layers="trail-line,trail-label" checked> <span class="sw" style="background:#5ad1c3"></span> trails (DDOT and NPS)</label>
    <label class="toggle"><input type="checkbox" class="lm" data-layers="lm-bikeshare"> <span class="sw" style="background:#4cc9f0"></span> Capital Bikeshare stations (size = docks)</label>
    <label class="toggle"><input type="checkbox" class="lm" data-layers="lm-shop,lm-shop-label"> <span class="sw" style="background:#ffd166"></span> bike shops (OSM)</label>
    <h4>Stories</h4><div class="stories" id="stories"></div>
    <h4>Citywide</h4><div id="citywide"></div>
    <details><summary>How to read this map</summary><ul>
      <li><b>Feels</b> is design only: what a cautious rider would feel. <b>Is</b> is the crash record, smoothed. <b>Gap</b> is where they disagree.</li>
      <li>Click any street for its scores and reasons, the nearest Mapillary street-level photo, and a <b>Street report</b> for the whole corridor: crash trend, worst blocks, and what DDOT has changed or planned there.</li>
      <li>Pick a <b>ward</b> for the same report at ward scale.</li>
      <li><b>Show</b> narrows the map: problem stretches, the kid-ok network (LTS 1), streets changed since 2019, or blocks with a rising trend.</li>
      <li>Low harm can mean few riders. There is no exposure data yet.</li></ul></details>
    <details><summary>Use cases</summary><ul>

  map.on("click","int-dot",e=>{ const p=e.features[0].properties; new GL.Popup({maxWidth:"360px"}).setLngLat(e.lngLat).setHTML(`<div class="pop"><h3>${esc(p.names||"intersection")}</h3><div class="row"><span class="k">Injury crashes since Oct 2021</span><span>${p.crashes} (${p.ksi} serious)</span></div><div class="row"><span class="k">Expected for this design</span><span>${(+p.mu).toFixed(1)}</span></div><div class="row"><span class="k">EB estimate</span><span>${(+p.eb).toFixed(1)}</span></div><div class="row"><span class="k">Approaches</span><span>${p.n_approaches}</span></div>${mlyBlock(e.lngLat)}</div>`).addTo(map); });
  map.on("mouseenter","int-dot",()=>map.getCanvas().style.cursor="pointer"); map.on("mouseleave","int-dot",()=>map.getCanvas().style.cursor="");
  if (h.street && reports.streets[h.street]) openStreet(h.street); else if (h.ward && reports.wards[h.ward]) openWard(h.ward); else applyFilters();
  $("tag").textContent = USE_MAPBOX ? "Mapbox GL JS · how streets feel vs. what happens on them" : "How streets feel vs. what happens on them. 28,978 segments, 2,297 injury crashes since Oct 2021.";
}
init().catch(err=>{ console.error(err); toast("Map failed to load: "+err.message); });
</script>
</body>
</html>
