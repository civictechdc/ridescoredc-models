name: CI

# This repo holds a Python package (tools/ridescore-cli), the database schema
# (schema/), and the pipeline definition (kestra/). CI checks all three.
#
# CI does NOT deploy. Kestra flows reach production by being synced from `main`
# (see kestra/README.md), and schema migrations are applied manually for now.

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]

jobs:
  # 1. Lint every Python file in the repo: the tool, its tests, the migrations.
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      - run: uv run ruff check tools/ schema/

  # 2. The tool's own tests. conftest.py blocks the network, so this needs no
  #    services and no fixtures beyond what is committed.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true
      # NOTE: --frozen once uv.lock has been regenerated for the workspace
      #       layout (`uv lock` at the repository root, then commit).
      - run: uv sync --group dev
      - name: pytest
        working-directory: tools/ridescore-cli
        run: uv run pytest -q

  # 3. Flow definitions. Kestra syncs kestra/flows/ from `main` automatically,
  #    so a malformed flow reaches the server the moment it merges. This is the
  #    only gate between a bad flow and production.
  flows:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml
      - name: parse, and check namespace matches folder
        run: |
          python - <<'PY'
          import pathlib, sys, yaml

          errors = []
          flows = sorted(pathlib.Path("kestra/flows").rglob("*.yml"))
          if not flows:
              sys.exit("no flows found under kestra/flows/")

          for path in flows:
              try:
                  doc = yaml.safe_load(path.read_text(encoding="utf-8"))
              except yaml.YAMLError as exc:
                  errors.append(f"{path}: not valid YAML -- {exc}")
                  continue
              if not isinstance(doc, dict):
                  errors.append(f"{path}: top level is not a mapping")
                  continue
              for key in ("id", "namespace", "tasks"):
                  if key not in doc:
                      errors.append(f"{path}: missing required key '{key}'")
              # sync_git_flows maps folders to child namespaces, so a mismatch
              # here means the flow lands somewhere nobody is looking for it.
              expected = f"prod.{path.parent.name}"
              if doc.get("namespace") not in (None, expected):
                  errors.append(
                      f"{path}: namespace is {doc['namespace']!r}, but its folder "
                      f"maps to {expected!r}"
                  )
              print(f"OK {path}  ->  {doc.get('namespace')}.{doc.get('id')}")

          if errors:
              print("\nFAIL:", file=sys.stderr)
              for e in errors:
                  print(f"  - {e}", file=sys.stderr)
              sys.exit(1)
          print(f"\nOK: {len(flows)} flows valid")
          PY

  # 4. Applied migrations are immutable — you ADD a new one, never edit history.
  #    (post-apply.py and functions/ are repeatable and exempt.)
  #    Retires with yoyo; see docs/ongoing-data-pipeline.md.
  append-only:
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: no edits/deletes to existing NNNN_ migrations
        run: |
          git fetch origin "${{ github.base_ref }}" --depth=1
          CHANGED=$(git diff --diff-filter=MD --name-only \
            "origin/${{ github.base_ref }}...HEAD" -- \
            'schema/migrations/[0-9]*.py' 'schema/migrations/[0-9]*.sql' || true)
          if [ -n "$CHANGED" ]; then
            echo "Modified/deleted already-committed migrations (add a new one instead):"
            echo "$CHANGED"; exit 1
          fi
          echo "OK: migrations are append-only"

  # 5. Apply against a throwaway PostGIS matching prod, assert the data landed,
  #    then prove rollback + re-apply work. Keep the image's major version in
  #    sync with staging/prod.
  smoke-apply:
    runs-on: ubuntu-latest
    needs: [lint]
    services:
      postgres:
        image: postgis/postgis:16-3.5   # PostgreSQL 16 — must match staging/prod
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: db
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 15
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/db
      PGPASSWORD: postgres
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r schema/requirements.txt

      # yoyo selects its Postgres driver from the URL scheme. Rewrite the plain
      # DATABASE_URL (used by psql below + Martin) to the psycopg 3 scheme.
      - name: derive psycopg3 URL for yoyo
        run: echo "YOYO_DATABASE_URL=postgresql+psycopg://${DATABASE_URL#postgres*://}" >> "$GITHUB_ENV"

      - name: apply
        run: yoyo apply --batch --database "$YOYO_DATABASE_URL" schema/migrations

      - name: assert data landed (tables non-empty, geometry valid, function present)
        run: |
          q() { psql "$DATABASE_URL" -tAc "$1" | tr -d '[:space:]'; }
          # 0001 is a full pg_dump, so the data ships inside the baseline itself —
          # assert the model tables came back non-empty rather than diffing CSVs.
          for t in ridescoredc crashes_dc; do
            got=$(q "SELECT count(*) FROM $t")
            echo "$t: $got rows"
            [ "$got" -gt 0 ] || { echo "FAIL: $t is empty after baseline load"; exit 1; }
          done
          [ "$(q "SELECT ST_SRID(wkb_geometry) FROM ridescoredc LIMIT 1")" = "4326" ] \
            || { echo "FAIL: unexpected SRID"; exit 1; }
          [ "$(q "SELECT count(*) FROM pg_proc WHERE proname='update_score'")" = "1" ] \
            || { echo "FAIL: update_score not created"; exit 1; }
          echo "OK: data + geometry + function verified"

      - name: assert rollback then re-apply (repeatability)
        run: |
          yoyo rollback --batch --database "$YOYO_DATABASE_URL" schema/migrations
          gone=$(psql "$DATABASE_URL" -tAc "SELECT to_regclass('public.ridescoredc') IS NULL")
          echo "$gone" | grep -q t || { echo "FAIL: rollback did not drop table"; exit 1; }
          yoyo apply --batch --database "$YOYO_DATABASE_URL" schema/migrations
          echo "OK: rollback + re-apply clean"
