# This repository is not a Python package. It is a workspace holding notebooks,
# SQL schema, Kestra flows, and one installable tool.
#
# That tool is tools/ridescore-cli. Its own pyproject.toml owns what it is and
# how it is tested. This file owns only what is shared across the whole tree:
# workspace membership, the single lockfile, and the lint rules.
#
#   uv sync              install the workspace (one .venv, at the root)
#   uv run ridescore      the CLI, from anywhere in the tree
#   uv run ruff check .   lint everything

[tool.uv.workspace]
# Every child of tools/ is an installable Python project. Nothing else in the
# repository is -- which is why kestra/, schema/ and notebooks/ are top level.
members = ["tools/*"]

[dependency-groups]
# One venv serves the whole workspace, so the tooling is declared once here
# rather than per member.
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[tool.ruff]
line-length = 100
src = ["tools/ridescore-cli/src", "tools/ridescore-cli/tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]

[tool.ruff.lint.per-file-ignores]
# A yoyo migration puts the schema directory on sys.path so it can import the
# helpers that live beside it, which has to happen before those imports run.
# E402 is inherent to the file kind, not a lapse in one file.
"schema/migrations/*.py" = ["E402"]
