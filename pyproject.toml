[project]
name = "ridescore"
version = "0.1.0"
description = "RideScore DC — the bike safety scoring pipeline"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    "geopandas>=1.0",
    "shapely>=2.0",
    "pyarrow>=17.0",
    "pandas>=2.2",
    "requests>=2.32",
    "typer>=0.12",
]

[project.scripts]
ridescore = "ridescore.cli:app"

[project.optional-dependencies]
db = ["psycopg[binary]>=3.2", "yoyo-migrations>=9.0"]

[dependency-groups]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ridescore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# No test may reach the network. Anything needing a fixture that does not exist
# yet should be marked and skipped, never quietly fetched.
addopts = "--strict-markers"
markers = ["slow: end-to-end over the committed extract"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
