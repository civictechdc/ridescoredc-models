# What RideScore is: three parts traffic stress, held against crash history and
# what the street offers a cyclist.
#
# These are the most contested numbers in the model. They are kept here, on
# their own, so that changing one is a one-line diff that can be reviewed
# without reading any Python, and so that nobody has to go looking for them
# among the lane-count lookup tables.
#
# The three must sum to 1. `build` fails if they do not, rather than quietly
# producing a score on a different scale.

[weights]
lts = 0.6
crash = 0.3
facility = 0.1
